<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>G+Lens fixture</title>
<style>
  ::-webkit-scrollbar { width: 17px; height: 17px; }
  ::-webkit-scrollbar-thumb { background: #9aa0a6; }
  ::-webkit-scrollbar-track { background: #e8eaed; }

  html { overflow-y: scroll; }
  body {
    margin: 0;
    font: 14px/1.6 system-ui, "Segoe UI", sans-serif;
    color: #202124;
    background: #fff;
  }
  .stripe {
    height: 64px;
    background: repeating-linear-gradient(90deg, #1a73e8 0 40px, #fff 40px 80px);
  }
  .wrap { padding: 24px; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  .grid { display: flex; gap: 16px; flex-wrap: wrap; }
  .card {
    border: 1px solid #dadce0;
    padding: 12px;
    width: 300px;
  }
  .card img { display: block; width: 100%; height: auto; }
  .dark {
    background: #1f1f1f;
    color: #e8eaed;
    padding: 24px;
    margin-top: 24px;
  }
  .dark img { width: 180px; }
  .tall { height: 900px; background: linear-gradient(#fff, #f1f3f4); }
  .narrow-note { margin-top: 24px; color: #5f6368; }
  iframe { width: 320px; height: 180px; border: 1px solid #dadce0; background: #fff; }
</style>
</head>
<body>
<div class="stripe"></div>
<div class="wrap">
  <h1>G+Lens fixture page</h1>
  <div class="grid">
    <div class="card">
      <img id="checker" alt="checker" src="data:image/svg+xml;utf8,
        <svg xmlns='http://www.w3.org/2000/svg' width='240' height='160'>
          <rect width='240' height='160' fill='%23ffffff'/>
          <rect x='0' y='0' width='60' height='40' fill='%23e8453c'/>
          <rect x='60' y='40' width='60' height='40' fill='%2334a853'/>
          <rect x='120' y='80' width='60' height='40' fill='%234285f4'/>
          <rect x='180' y='120' width='60' height='40' fill='%23fbbc04'/>
          <rect x='0' y='120' width='240' height='6' fill='%23000'/>
        </svg>">
    </div>
    <div class="card">
      <svg id="vector" width="240" height="160" viewBox="0 0 240 160">
        <rect width="240" height="160" fill="#fff7e6"/>
        <circle cx="60" cy="60" r="36" fill="#e8453c"/>
        <circle cx="180" cy="100" r="36" fill="#1a73e8"/>
        <text x="120" y="150" font-size="20" text-anchor="middle" fill="#202124">G+Lens</text>
      </svg>
    </div>
  </div>

  <div class="dark">
    <p>深色區塊，用來檢查白線與角標是否仍可見。</p>
    <img alt="dark checker" src="data:image/svg+xml;utf8,
      <svg xmlns='http://www.w3.org/2000/svg' width='180' height='120'>
        <rect width='180' height='120' fill='%23202024'/>
        <rect x='10' y='10' width='70' height='46' fill='%23fbbc04'/>
        <rect x='100' y='64' width='70' height='46' fill='%238ab4f8'/>
      </svg>">
  </div>

  <p class="narrow-note">下方 iframe 內有另一份文件，用來確認框選只作用於主頁面。</p>
  <iframe title="nested" srcdoc="<!DOCTYPE html><html><body style='margin:0;font:13px system-ui;background:%23fffbe6'><div style='padding:12px'>nested frame<br>不會被框選覆蓋</div><div style='height:120px;background:%23d2e3fc'></div></body></html>"></iframe>

  <div class="tall"></div>
  <p>頁面底部。</p>
</div>
</body>
</html>
